<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Loja de Roupas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f3f3;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 450px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            margin-bottom: 18px;
            border-radius: 6px;
            border: 1px solid #aaa;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #218838;
        }

        .mensagem {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-left: 6px solid #28a745;
            background: #d4edda;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Criar Conta</h1>

        <label>Nome completo:</label>
        <input type="text" id="nome" placeholder="Seu nome completo">

        <label>CEP:</label>
        <input type="text" id="cep" placeholder="00000-000">

        <label>Endereço:</label>
        <input type="text" id="endereco" placeholder="Rua, número, bairro">

        <label>CPF:</label>
        <input type="text" id="cpf" placeholder="000.000.000-00">

        <label>Número do cartão:</label>
        <input type="text" id="cartao" placeholder="0000 0000 0000 0000">

        <button onclick="criarConta()">Criar Conta</button>

        <div id="mensagem" class="mensagem"></div>
    </div>

    <script>
        function criarConta() {
            let nome = document.getElementById("nome").value;
            let cep = document.getElementById("cep").value;
            let endereco = document.getElementById("endereco").value;
            let cpf = document.getElementById("cpf").value;
            let cartao = document.getElementById("cartao").value;

            if (!nome || !cep || !endereco || !cpf || !cartao) {
                alert("Por favor, preencha todos os campos.");
                return;
            }

            document.getElementById("mensagem").style.display = "block";
            document.getElementById("mensagem").innerHTML =
                `Conta criada com sucesso!<br>Bem-vindo(a), <strong>${nome}</strong>.`;
        }
    </script>

</body>
</html>
