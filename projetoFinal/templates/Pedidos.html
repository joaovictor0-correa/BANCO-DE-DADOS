
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fazer Pedido - Loja de Roupas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #eee;
        }

        input[type="number"] {
            width: 60px;
            padding: 5px;
        }

        #total {
            font-size: 22px;
            font-weight: bold;
            text-align: right;
            margin-top: 20px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #218838;
        }

        .resultado {
            font-size: 20px;
            padding: 10px;
            background: #dff0d8;
            border-left: 5px solid #28a745;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>

<body>

    <h1>Fazer Pedido</h1>

    <div class="container">

        <table>
            <tr>
                <th>Produto</th>
                <th>Preço</th>
                <th>Quantidade</th>
            </tr>

            <tr>
                <td>Camiseta</td>
                <td>R$ 39.90</td>
                <td><input type="number" id="camiseta" min="0" value="0"></td>
            </tr>

            <tr>
                <td>Calça</td>
                <td>R$ 119.90</td>
                <td><input type="number" id="calca" min="0" value="0"></td>
            </tr>

            <tr>
                <td>Shorts</td>
                <td>R$ 49.90</td>
                <td><input type="number" id="shorts" min="0" value="0"></td>
            </tr>

            <tr>
                <td>Moletom</td>
                <td>R$ 149.90</td>
                <td><input type="number" id="moletom" min="0" value="0"></td>
            </tr>

            <tr>
                <td>Tênis</td>
                <td>R$ 199.90</td>
                <td><input type="number" id="tenis" min="0" value="0"></td>
            </tr>
        </table>

        <button onclick="finalizarPedido()">Finalizar Pedido</button>

        <div id="resultado" class="resultado"></div>

    </div>

    <script>
        function finalizarPedido() {
            let camiseta = parseInt(document.getElementById("camiseta").value) || 0;
            let calca = parseInt(document.getElementById("calca").value) || 0;
            let shorts = parseInt(document.getElementById("shorts").value) || 0;
            let moletom = parseInt(document.getElementById("moletom").value) || 0;
            let tenis = parseInt(document.getElementById("tenis").value) || 0;

            // preços
            const preco = {
                camiseta: 39.90,
                calca: 119.90,
                shorts: 49.90,
                moletom: 149.90,
                tenis: 199.90
            };

            let total =
                camiseta * preco.camiseta +
                calca * preco.calca +
                shorts * preco.shorts +
                moletom * preco.moletom +
                tenis * preco.tenis;

            let resultado = document.getElementById("resultado");

            if (total === 0) {
                resultado.style.display = "block";
                resultado.style.background = "#f8d7da";
                resultado.style.borderLeft = "5px solid #dc3545";
                resultado.innerHTML = "Nenhum produto selecionado.";
                return;
            }

            resultado.style.display = "block";
            resultado.style.background = "#d4edda";
            resultado.style.borderLeft = "5px solid #28a745";
            resultado.innerHTML = `Pedido finalizado!<br>Total a pagar: <strong>R$ ${total.toFixed(2)}</strong>`;
        }
    </script>

</body>
</html>
